<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Liquid Layers Modded</title>
<style>
  :root { --bg:#10131a; --panel:#1b2030; --ink:#e6e9f2; --accent:#8ab4ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px system-ui,sans-serif; overflow:hidden; touch-action:none; }
  #stage { position:fixed; inset:0 0 64px 0; background:#000; }
  canvas { background:#000; display:block; touch-action:none; }
  #bar { position:fixed; left:0; right:0; bottom:0; height:64px; background:var(--panel); display:flex; gap:8px; align-items:center; padding:0 12px; overflow-x:auto; }
  button { background:#2a3150; color:var(--ink); border:2px solid transparent; border-radius:14px; padding:8px 12px; font-size:14px; cursor:pointer; white-space:nowrap; }
  button.on { border-color:var(--accent); background:#34406b; }
  button:active { transform:scale(.96); }
  label { display:flex; align-items:center; gap:6px; white-space:nowrap; }
  input[type=range] { width:90px; }
  .sep { width:1px; align-self:stretch; background:#ffffff22; margin:10px 2px; }
  #hint { position:fixed; top:10px; left:50%; transform:translateX(-50%); background:#000a; padding:6px 12px; border-radius:20px; pointer-events:none; transition:opacity .6s; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="hint">Pick an object, then tap the tank to drop it. Drag the liquid to push it around, drag objects to grab them.</div>
<div id="bar">
  <button data-t="ball" class="on">⚽ Ball</button>
  <button data-t="duck">🦆 Duck</button>
  <button data-t="crate">📦 Crate</button>
  <button data-t="boat">⛵ Boat</button>
  <button data-t="anchor">⚓ Anchor</button>
  <div class="sep"></div>
  <label>Tilt <input id="tilt" type="range" min="-90" max="90" value="0"></label>
  <label>Gravity <input id="grav" type="range" min="0" max="40" value="20"></label>
  <button id="motion">📱 Motion</button>
  <button id="clear">Clear objects</button>
  <button id="reset">Reset</button>
</div>
<script src="engine.js"></script>
<script>
(() => {
const TARGET_PARTICLES = 7000;   // how many liquid "balls" to aim for (more = finer, but slower)
const FILL = 0.38, BODY_SCALE = 1.5;
const stage = document.getElementById('stage');
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let world, GX, GY, S = 10, dpr = 1, steps = 2, slow = 0, sprites = [], spriteD = 4, lastT = 0;
const tiltEl = () => document.getElementById('tilt'), gravEl = () => document.getElementById('grav');

// Build a tank that exactly fills the screen. The outer 3 cells of the grid are an invisible wall margin.
function build() {
  const st = stage.getBoundingClientRect(), W = Math.floor(st.width), H = Math.floor(st.height);
  const cellsX = Math.round(W / Math.max(6, Math.min(14, W / 150)));
  S = W / cellsX;
  const cellsY = Math.max(20, Math.floor(H / S));
  GX = cellsX + 6; GY = cellsY + 6;
  const ppc = Math.max(2, Math.min(8, Math.round(TARGET_PARTICLES / (FILL * (GX - 8) * (GY - 8)))));
  world = new LL.World(GX, GY, { ppc, fill: FILL, bodyScale: BODY_SCALE });
  world.g = gravEl().value / 1000;
  world.tilt = tiltEl().value * Math.PI / 180;
  dpr = 1; // keep it at 1: the particles are tiny, retina doubles the fill cost for no visible gain
  cv.style.width = W + 'px'; cv.style.height = cellsY * S + 'px';
  cv.width = Math.round(W * dpr); cv.height = Math.round(cellsY * S * dpr);
  window.__world = world;
  // pre-draw one small sprite per layer (colored ball with a thin black rim); drawing images is far cheaper than tracing 1000s of arcs
  spriteD = Math.max(3, Math.round(world.liq.spacing * 1.12 * S * dpr));
  sprites = LL.LAYERS.map(l => {
    const c = document.createElement('canvas'); c.width = c.height = spriteD;
    const g = c.getContext('2d'), h = spriteD / 2;
    g.fillStyle = '#000'; g.beginPath(); g.arc(h, h, h, 0, 6.2832); g.fill();
    g.fillStyle = l.color; g.beginPath(); g.arc(h, h, Math.max(1, h - Math.max(0.6, spriteD * 0.1)), 0, 6.2832); g.fill();
    return c;
  });
  slow = 0; steps = 2;
}
let resizeT = 0;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(build, 250); });

/* ---------- UI ---------- */
let sel = 'ball';
document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
  sel = b.dataset.t;
  document.querySelectorAll('[data-t]').forEach(x => x.classList.toggle('on', x === b));
});
const tilt = tiltEl(), grav = gravEl();
let motionOn = false;
tilt.oninput = () => { if (!motionOn) world.tilt = tilt.value * Math.PI / 180; };
grav.oninput = () => { world.g = grav.value / 1000; };
document.getElementById('clear').onclick = () => { world.bodies.length = 0; };
document.getElementById('reset').onclick = () => { world.bodies.length = 0; world.liq.fill(FILL); };
document.getElementById('motion').onclick = async () => {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
      if (await DeviceOrientationEvent.requestPermission() !== 'granted') return;
    }
  } catch (e) { return; }
  motionOn = !motionOn;
  document.getElementById('motion').classList.toggle('on', motionOn);
  if (!motionOn) world.tilt = tilt.value * Math.PI / 180;
};
addEventListener('deviceorientation', e => {
  if (!motionOn || e.gamma == null) return;
  world.tilt = Math.max(-1.4, Math.min(1.4, e.gamma * Math.PI / 180));
});
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') tilt.value = Math.max(-90, +tilt.value - 5);
  else if (e.key === 'ArrowRight') tilt.value = Math.min(90, +tilt.value + 5);
  else return;
  tilt.oninput();
});
setTimeout(() => document.getElementById('hint').style.opacity = 0, 6000);

/* ---------- pointer: drop / grab / stir ---------- */
const ptrs = new Map();
function pos(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) / S + 3, (e.clientY - r.top) / S + 3];
}
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  const [x, y] = pos(e);
  let hit = null;
  for (let i = world.bodies.length - 1; i >= 0; i--) if (world.bodies[i].contains(x, y)) { hit = world.bodies[i]; break; }
  if (hit) {
    const c = Math.cos(-hit.a), s = Math.sin(-hit.a), dx = x - hit.x, dy = y - hit.y;
    hit.grab = { lx: c * dx - s * dy, ly: s * dx + c * dy, tx: x, ty: y };
    ptrs.set(e.pointerId, { mode: 'grab', body: hit });
  } else {
    ptrs.set(e.pointerId, { mode: 'down', x, y, moved: 0 });
  }
});
cv.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const [x, y] = pos(e);
  if (p.mode === 'grab') { p.body.grab.tx = x; p.body.grab.ty = y; return; }
  const dx = x - p.x, dy = y - p.y;
  p.moved += Math.abs(dx) + Math.abs(dy);
  if (p.moved > 0.8) { p.mode = 'stir'; world.stirReq = { x, y, dx, dy, r: 85 / S }; }
  p.x = x; p.y = y;
});
function up(e) {
  const p = ptrs.get(e.pointerId); if (!p) return;
  if (p.mode === 'grab') p.body.grab = null;
  else if (p.mode === 'down') {
    if (world.bodies.length < 40) {
      const b = world.add(sel, Math.max(13, Math.min(GX - 14, p.x)), Math.max(9, p.y));
      b.a = (Math.random() - 0.5) * 0.4;
    }
  }
  ptrs.delete(e.pointerId);
  if (!ptrs.size) world.stirReq = null;
}
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);

/* ---------- drawing ---------- */
function drawBody(b) {
  const k = b.sc, R = b.radius / k;
  const bodyPath = () => {
    ctx.beginPath();
    b.hull.forEach((p, i) => i ? ctx.lineTo(p[0] / k, p[1] / k) : ctx.moveTo(p[0] / k, p[1] / k));
    ctx.closePath();
  };
  ctx.save();
  ctx.translate(b.x, b.y); ctx.rotate(b.a); ctx.scale(k, k);
  ctx.lineJoin = 'round'; ctx.lineWidth = 0.18;
  if (b.type === 'ball') {
    const r = R;
    const g = ctx.createRadialGradient(-r * .3, -r * .35, r * .1, 0, 0, r);
    g.addColorStop(0, '#fff'); g.addColorStop(1, '#d6d9e2');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
    ctx.fillStyle = '#222'; ctx.beginPath();
    for (let i = 0; i < 5; i++) { const a = i / 5 * 6.283 - 1.57; ctx.lineTo(Math.cos(a) * r * .38, Math.sin(a) * r * .38); }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#222'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();
  } else if (b.type === 'duck') {
    const r = R;
    ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(0, 0.2, r, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(r * .35, -r * .65, r * .5, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff8c1a'; ctx.beginPath(); ctx.moveTo(r * .75, -r * .7); ctx.lineTo(r * 1.25, -r * .55); ctx.lineTo(r * .75, -r * .4); ctx.fill();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(r * .5, -r * .8, r * .07, 0, 7); ctx.fill();
  } else if (b.type === 'crate') {
    ctx.fillStyle = '#b07a3c'; ctx.strokeStyle = '#6b4620';
    ctx.fillRect(-3, -3, 6, 6); ctx.strokeRect(-3, -3, 6, 6);
    ctx.beginPath(); ctx.moveTo(-3, -3); ctx.lineTo(3, 3); ctx.moveTo(3, -3); ctx.lineTo(-3, 3); ctx.stroke();
  } else if (b.type === 'boat') {
    ctx.fillStyle = '#c0392b'; bodyPath(); ctx.fill();
    ctx.strokeStyle = '#7a1d14'; ctx.stroke();
    const top = b.hull[0][1] / k;
    ctx.strokeStyle = '#5b4636'; ctx.lineWidth = 0.3;
    ctx.beginPath(); ctx.moveTo(0, top); ctx.lineTo(0, top - 7.5); ctx.stroke();
    ctx.fillStyle = '#f5f1e6'; ctx.beginPath(); ctx.moveTo(0.4, top - 7); ctx.lineTo(5, top - 0.6); ctx.lineTo(0.4, top - 0.6); ctx.fill();
    ctx.fillStyle = '#e8e2d0'; ctx.beginPath(); ctx.moveTo(-0.4, top - 6); ctx.lineTo(-3.6, top - 0.6); ctx.lineTo(-0.4, top - 0.6); ctx.fill();
  } else if (b.type === 'anchor') {
    ctx.fillStyle = '#6c7a89'; bodyPath(); ctx.fill();
    ctx.strokeStyle = '#3b4652'; ctx.stroke();
  }
  ctx.restore();
}

function frame(now) {
  // measure real frame-to-frame time (includes compositing), and back off physics steps if we can't hold ~40fps
  if (lastT) {
    const d = now - lastT;
    if (d > 26) { if (++slow > 25 && steps > 1) { steps = 1; slow = 0; } } else if (slow > 0) slow--;
  }
  lastT = now;
  for (let i = 0; i < steps; i++) world.step();
  const L = world.liq, n = L.n, X = L.x, Y = L.y, M = L.mat, h = spriteD / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  // the visible tank is the grid minus its 3-cell wall margin on every side
  for (let p = 0; p < n; p++) {
    ctx.drawImage(sprites[M[p]], ((X[p] - 3) * S) * dpr - h, ((Y[p] - 3) * S) * dpr - h);
  }
  ctx.setTransform(dpr * S, 0, 0, dpr * S, -3 * S * dpr, -3 * S * dpr);
  for (const b of world.bodies) drawBody(b);
  requestAnimationFrame(frame);
}
build();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
